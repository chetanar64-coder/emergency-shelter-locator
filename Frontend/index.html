<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emergency Shelter & Resource Locator - Bengaluru</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

  <!-- Custom CSS -->
  <link rel="stylesheet" href="style.css" />
</head>

<body class="map-page">

  <!-- Top Header Bar with Navigation -->
  <header class="app-header">
    <div class="header-left">
      <div class="header-title">
        <span>🛡️</span> Emergency Shelter &amp; Resource Locator &mdash; Bengaluru
      </div>
      <nav class="nav-links">
        <a href="index.html" class="nav-link active">🗺️ Live Map</a>
        <a href="customer.html" class="nav-link">📝 Citizen Registration</a>
        <a href="admin.html" class="nav-link">⚙️ Admin Dashboard</a>
      </nav>
    </div>
    <div id="api-badge" class="api-badge">Connecting API...</div>
  </header>

  <!-- Main Layout -->
  <main class="main-layout">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-title">Filter Shelters</div>

      <label class="filter-box">
        <input type="checkbox" id="filter-available" />
        <span class="filter-text">Available Beds Only (&gt;0)</span>
      </label>

      <label class="filter-box">
        <input type="checkbox" id="filter-food-water" />
        <span class="filter-text">Food &amp; Water Available</span>
      </label>

      <div class="legend-card">
        <div class="legend-title">Map Legend</div>
        <div class="legend-item">
          <span class="legend-dot open"></span>
          <span>Open Shelter (Beds Available)</span>
        </div>
        <div class="legend-item">
          <span class="legend-dot full"></span>
          <span>Full Shelter (0 Beds)</span>
        </div>
        <div class="legend-footer">
          SDG 11 &middot; Sustainable Cities &amp; Communities<br />
          Live MySQL + FastAPI Backend
        </div>
      </div>
    </aside>

    <!-- Map Area -->
    <section class="map-container">
      <div id="map"></div>
    </section>

  </main>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <!-- App Logic -->
  <script src="script.js"></script>
</body>

</html>
